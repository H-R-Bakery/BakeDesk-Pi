server {
    listen 80;
    server_name bakedesk.local;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Mercure is internal to Compose. Browsers connect through the primary
    # BakeDesk origin so no hub port is exposed on the host.
    location = /.well-known/mercure {
        proxy_pass http://mercure:80/.well-known/mercure;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location ~* \.(?:css|js|map|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri /index.php$is_args$args;
    }

    # Only Symfony's front controller may execute PHP.
    location ~ ^/index\.php(?:/|$) {
        try_files $fastcgi_script_name =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php:9000;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }
}
